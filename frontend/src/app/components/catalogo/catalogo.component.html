<div style="padding: 20px; font-family: sans-serif;">
  <h2>🎮 Catálogo de Videojuegos</h2>
  <button routerLink="/formulario" style="margin-bottom: 15px; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer;">+ Añadir Videojuego</button>
  
  <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead style="background: #f2f2f2;">
      <tr>
        <th style="padding: 10px;">Título</th>
        <th style="padding: 10px;">Género</th>
        <th style="padding: 10px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let juego of videojuegos">
        <td style="padding: 10px;">{{ juego.titulo }}</td>
        <td style="padding: 10px;">{{ juego.genero }}</td>
        <td style="padding: 10px;">
          <button (click)="verDetalle(juego)" style="padding: 5px 10px; background: #007bff; color: white; border: none; cursor: pointer;">Ver Ficha</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
